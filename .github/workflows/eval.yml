name: Eval

# Eval-Gates (Issue #29): Retrieval-Schicht kostenlos bei jedem PR, Agentenlauf und Schaltschrank-IoU
# nachts mit Kostendeckel (braucht ANTHROPIC_API_KEY als Secret; ohne Secret wird der Job uebersprungen).
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"  # woechentlich (Montag), Issue #49: Deckel ca. 8 $/Monat statt bis zu 60 $
  workflow_dispatch:
    inputs:
      max_cost_usd:
        description: Kostendeckel fuer den Agentenlauf (USD)
        default: "2.00"
      chat_model:
        description: "Chat-Modell fuer diesen Lauf, z. B. openai:gpt-5-mini oder claude-sonnet-5 (leer = Variable EVAL_CHAT_MODEL)"
        default: ""
      vision_model:
        description: "Vision-Modell fuer die Schaltschrank-IoU, z. B. openai:gpt-5 (leer = Variable EVAL_VISION_MODEL)"
        default: ""

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+psycopg://stromlauf:stromlauf@localhost:5432/stromlauf
  EMBEDDING_PROVIDER: local
  HF_HOME: /home/runner/.cache/huggingface
  DATA_DIR: /tmp/stromlauf-data
  PYTHONUNBUFFERED: "1"  # Fortschrittszeilen der Lade-Skripte mit echten Zeitstempeln im Log
  # Stand der Modelle im Modellcache (bge-m3, Docling); hochzaehlen, wenn sich Modelle aendern. Der Embedding-Cache
  # haengt daran, damit nie Vektoren eines alten Modells zurueckkommen.
  MODELLCACHE_VERSION: v1

jobs:
  # Lesegenauigkeit je Seite gegen Ground Truth, ohne DB, Backend und Modellaufruf: eigener Job neben dem Retrieval-Gate
  ingest:
    name: Ingest-Gate (Lesegenauigkeit, kostenlos)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Runner-CPU (gleiche Arbeit dauert je Runner unterschiedlich lange)
        run: lscpu | grep -E 'Model name|^CPU\(s\)'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Modellcache (bge-m3, Docling)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-bge-m3-docling-${{ runner.os }}-${{ env.MODELLCACHE_VERSION }}
      - name: Backend mit CPU-Torch installieren
        working-directory: backend
        run: |
          # torch und torchvision aus demselben Index, sonst passt torchvision (PyPI, CUDA-Build) nicht zum CPU-torch
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev]"
      # Geraeteanschluesse am Schaltzeichen (Issue #102): lieber weglassen als falsch zuordnen, darum Recall 0,90
      - name: "Ingest-Benchmark FB-01 (Kennzeichen je Seite gegen Ground Truth, Issue #63, ohne Modell und ohne DB)"
        run: python eval/run_ingest.py --gold eval/ingest_gold/fb01.json --min 0.95 --types device,terminal,plc_address,device_pin --min-for device_pin=0.90
      - name: "Ingest-Benchmark UR-01 und PM1-AR (Issue #68, zwei weitere Layouts)"
        run: |
          python eval/run_ingest.py --gold eval/ingest_gold/ur01.json --min 0.95 --types device,terminal,plc_address,device_pin --min-for device_pin=0.90
          python eval/run_ingest.py --gold eval/ingest_gold/pm1_ar.json --min 0.95 --types device,terminal,plc_address,device_pin --min-for device_pin=0.90
      # Leitungsleser (Stoerfall-Arbeitsflaeche): Kanten aus dem Plan gegen das gezeichnete Gold und gegen die Tabellen
      # derselben Maschine. Eine falsche Verbindung schadet mehr als eine fehlende: Gate nur auf die Precision.
      - name: "Planleser FB-01, UR-01, PM1-AR (Leitungen gegen Gold und Tabellen, Precision >= 0,95, Recall berichtet)"
        run: |
          python eval/run_plan_graph.py --gold eval/ingest_gold/fb01.json --min-precision 0.95
          python eval/run_plan_graph.py --gold eval/ingest_gold/ur01.json --min-precision 0.95
          python eval/run_plan_graph.py --gold eval/ingest_gold/pm1_ar.json --min-precision 0.95
      # Klemmen neben dem Klemmenkreis liest die OCR als "O X1:2" (gemessen 0,81, Issue #65); Schwelle darum 0,75
      - name: "Ingest-Benchmark Voll-Scan mit OCR (Issue #66, RapidOCR lokal auf der CPU)"
        run: >-
          python eval/run_ingest.py --gold eval/ingest_gold/fb01.json
          --doc examples/scan/01_Stromlaufplan_FB-01_scan.pdf --label scan-ocr --ocr
          --min 0.95 --min-for terminal=0.75 --min-for device_pin=0.90 --types device,terminal,plc_address,device_pin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-nachweise
          path: |
            eval/results/ingest_*.json
            eval/results/ingest_*.md
            eval/results/plan_graph_*.json
            eval/results/plan_graph_*.md
          retention-days: 14

  # Das Einlesen der Quellen (Embeddings mit bge-m3 auf der CPU) kostet die meiste Zeit: nacheinander in einem Job
  # 16,8 min (2026-09-30). Drei Gruppen laufen parallel, jede laedt nur ihre Quellen und prueft deren Fragen mit
  # denselben Schwellen.
  retrieval:
    name: Retrieval-Gate ${{ matrix.gruppe }} (kostenlos)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EMBEDDING_CACHE_DIR: /home/runner/.cache/stromlauf-embeddings  # app/embeddings.py, CachedEmbeddings
    strategy:
      fail-fast: false
      matrix:
        include:
          - gruppe: FB-01  # dazu Abnahme-Nachweise, Zitat-Resolver, Frontend-Build und Lighthouse
            quellen: "Foerderband FB-01,Injection-Test,Scan FB-01"
          - gruppe: UR-01
            quellen: "Umroller UR-01"
          - gruppe: PM1-AR
            quellen: "Aufrollung PM1-AR"
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: stromlauf
          POSTGRES_PASSWORD: stromlauf
          POSTGRES_DB: stromlauf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stromlauf -d stromlauf"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Runner-CPU (gleiche Arbeit dauert je Runner unterschiedlich lange)
        run: lscpu | grep -E 'Model name|^CPU\(s\)'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Modellcache (bge-m3, Docling)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-bge-m3-docling-${{ runner.os }}-${{ env.MODELLCACHE_VERSION }}
      # Vektoren je Abschnittstext: nur neue oder geaenderte Abschnitte rechnet bge-m3 neu. Ein aelterer Stand kommt
      # nur zurueck, solange Embedding-Code, Abhaengigkeiten und Modelle gleich sind; Beispiele und Ingestion-Code
      # stecken im Inhalt der Abschnitte (Schluessel je Datei) und bestimmen nur, wann ein neuer Stand gespeichert wird.
      - name: Embedding-Cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/stromlauf-embeddings
          key: >-
            emb-${{ runner.os }}-${{ env.MODELLCACHE_VERSION }}-${{ matrix.gruppe }}-${{
            hashFiles('backend/app/embeddings.py', 'backend/pyproject.toml') }}-${{
            hashFiles('examples/**', 'backend/app/**') }}
          restore-keys: >-
            emb-${{ runner.os }}-${{ env.MODELLCACHE_VERSION }}-${{ matrix.gruppe }}-${{
            hashFiles('backend/app/embeddings.py', 'backend/pyproject.toml') }}-
      - name: Backend mit CPU-Torch installieren
        working-directory: backend
        run: |
          # torch und torchvision aus demselben Index, sonst passt torchvision (PyPI, CUDA-Build) nicht zum CPU-torch
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev]"
      - name: Backend starten
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --port 8010 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8010/api/health && break; sleep 2; done
          curl -sf http://localhost:8010/api/health
      - name: Demo-Maschine FB-01 laden und Abnahme-Nachweise sammeln (Ingestion ohne Vision, kein Gate)
        if: matrix.gruppe == 'FB-01'
        run: python scripts/acceptance.py --api http://localhost:8010 --load --out eval/results
      - name: "Injection-Testdaten laden (Issue #48, ein Markdown-Handbuch)"
        if: matrix.gruppe == 'FB-01'
        run: python scripts/load_folder.py examples/injection --name "Injection-Test" --api http://localhost:8010
      - name: "Scan-Fassung FB-01 laden (Issue #66, nur der Voll-Scan als eigene Quelle, OCR im Upload)"
        if: matrix.gruppe == 'FB-01'
        run: python scripts/load_folder.py examples/scan --pattern "*_scan.pdf" --name "Scan FB-01" --api http://localhost:8010
      - name: "Testdokumentation UR-01 laden (Issue #49, 6 Dateien)"
        if: matrix.gruppe == 'UR-01'
        run: python scripts/load_folder.py examples/umroller --name "Umroller UR-01" --api http://localhost:8010
      - name: "Testdokumentation PM1-AR laden (Issue #49, 6 Dateien)"
        if: matrix.gruppe == 'PM1-AR'
        run: python scripts/load_folder.py examples/aufrollung --name "Aufrollung PM1-AR" --api http://localhost:8010
      - name: Retrieval-Eval mit Schwellwerten (${{ matrix.quellen }})
        run: python eval/run_retrieval.py --api http://localhost:8010 --only "${{ matrix.quellen }}" --min 0.9 --min-sources 0.9
      - name: "Zitat-Resolver gegen den Referenzlauf (Issue #46, kostenlos, Regressionstest)"
        if: matrix.gruppe == 'FB-01'
        run: >-
          python eval/rescore.py eval/results/referenz_2026-09-28_claude-sonnet-5.json --api http://localhost:8010
          --out eval/results/rescore_gate_claude-sonnet-5.json --min-citations 0.9
          --expect-invalid "[[02_Stueckliste_FB-01.xlsx|-X3:3]]" --expect-invalid "[[05_Symboltabelle_FB-01.sdf|-]]"
      - uses: actions/setup-node@v4
        if: matrix.gruppe == 'FB-01'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend als Produktions-Build gegen das lokale Backend starten
        if: matrix.gruppe == 'FB-01'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8010
        run: |
          npm ci
          npm run build
          nohup npm run start > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100/login && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3100/login
      - name: Lighthouse Accessibility >= 90 auf der Maschinenansicht (contract.md §5)
        if: matrix.gruppe == 'FB-01'
        run: node frontend/scripts/lighthouse-a11y.mjs --base http://localhost:3100 --api http://localhost:8010 --out eval/results
      - name: Logs bei Fehler
        if: failure()
        run: |
          grep -nE "Traceback|Error|failed|Fehler" /tmp/backend.log | tail -n 60 || true
          tail -n 120 /tmp/backend.log
          tail -n 40 /tmp/frontend.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abnahme-nachweise-${{ matrix.gruppe }}
          path: |
            eval/results/retrieval_*.json
            eval/results/rescore_gate_*.json
            eval/results/acceptance_*.json
            eval/results/acceptance_*.md
            eval/results/lighthouse-a11y.report.*
          retention-days: 14

  nightly:
    name: Woechentlicher Agentenlauf + Schaltschrank-IoU (kostenpflichtig, Deckel)
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.repository == 'siinanXD/stromlauf-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: eval
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: stromlauf
          POSTGRES_PASSWORD: stromlauf
          POSTGRES_DB: stromlauf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stromlauf -d stromlauf"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Secrets liegen als Repository-Secrets (Settings -> Secrets and variables -> Actions); OPEN_API_KEY ist der
      # dort gewaehlte Name fuer den OpenAI-Schluessel, LANGFUSE_BASE_URL der fuer den Langfuse-Host.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST || secrets.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
      CHAT_MODEL: ${{ github.event.inputs.chat_model || vars.EVAL_CHAT_MODEL || 'claude-sonnet-5' }}
      VISION_MODEL: ${{ github.event.inputs.vision_model || vars.EVAL_VISION_MODEL || 'claude-sonnet-5' }}
    steps:
      - uses: actions/checkout@v4
      - name: Schluessel fuer das gewaehlte Chat-Modell vorhanden?
        id: secret
        run: |
          case "$CHAT_MODEL" in
            openai:*|gpt-*|o1*|o3*|o4*) key="$OPENAI_API_KEY"; name="OPENAI_API_KEY" ;;
            *) key="$ANTHROPIC_API_KEY"; name="ANTHROPIC_API_KEY" ;;
          esac
          if [ -z "$key" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$name fehlt fuer CHAT_MODEL=$CHAT_MODEL: Nightly uebersprungen"; fi
          echo "Chat-Modell: $CHAT_MODEL, Vision-Modell: $VISION_MODEL"
      - uses: actions/setup-python@v5
        if: steps.secret.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/cache@v4
        if: steps.secret.outputs.skip != 'true'
        with:
          path: /home/runner/.cache/huggingface
          key: hf-bge-m3-docling-${{ runner.os }}-${{ env.MODELLCACHE_VERSION }}
      - name: Backend installieren und starten
        if: steps.secret.outputs.skip != 'true'
        working-directory: backend
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev,trace]"
          nohup python -m uvicorn app.main:app --port 8010 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8010/api/health && break; sleep 2; done
      - name: Demo-Maschine und Injection-Testdaten laden
        if: steps.secret.outputs.skip != 'true'
        run: |
          python scripts/load_example.py --api http://localhost:8010
          python scripts/load_folder.py examples/injection --name "Injection-Test" --api http://localhost:8010
      - name: Agentenlauf FB-01 und Injection-Fallen mit Kostendeckel
        if: steps.secret.outputs.skip != 'true'
        run: python eval/run_eval.py --api http://localhost:8010 --only "Foerderband FB-01,Injection-Test" --min 0.8 --min-citations 0.9 --max-cost "${{ github.event.inputs.max_cost_usd || '2.00' }}"
      - name: Schaltschrank-IoU (ein Vision-Aufruf)
        if: steps.secret.outputs.skip != 'true'
        run: python eval/run_cabinet.py --api http://localhost:8010 --min-iou 0.5 --min-share 0.8
      - name: Backend-Log bei Fehler
        if: failure()
        run: tail -n 200 /tmp/backend.log
      - uses: actions/upload-artifact@v4
        if: always() && steps.secret.outputs.skip != 'true'
        with:
          name: nightly-results
          path: |
            eval/results/*.json
          retention-days: 30
