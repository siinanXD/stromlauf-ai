name: CI

# Laeuft bei jedem Push auf master und jedem Pull Request (Repo ist oeffentlich, Actions kostenlos).
# Lokal laufen dieselben Pruefungen mit `python scripts/check.py` (Hook: `python scripts/check.py --install-hook`).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # gitleaks selbst statt gitleaks-action: Die Action prueft bei PR und Push nur die neuen Commits (Issue #51).
  # Ausnahmen stehen in .gitleaks.toml (nur feste Testwerte der Backend-Tests).
  gitleaks:
    name: Secret-Scan (gitleaks, gesamte Historie)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # alle Commits, nicht nur den Stand dieses Laufs
      - name: gitleaks laden und Pruefsumme pruefen
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Alle Commits bis zum geprueften Stand scannen
        # HEAD statt --all: die Historie dieses Stands, nicht die Branches anderer offener PRs
        run: ./gitleaks git --redact --verbose --log-opts="--full-history HEAD" .

  backend:
    name: Backend (pytest, ruff)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: stromlauf
          POSTGRES_PASSWORD: stromlauf
          POSTGRES_DB: stromlauf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stromlauf -d stromlauf"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://stromlauf:stromlauf@localhost:5432/stromlauf
      STROMLAUF_DB_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Torch und Torchvision (CPU) vor Docling, sonst zieht pip die CUDA-Variante
        # beide aus dem CPU-Index: torchvision von PyPI verlangt ein bestimmtes torch und ersetzt ein neueres CPU-Torch
        # sonst durch CUDA-Torch (rund 3 GB NVIDIA-Pakete je Lauf, Tests mit anderer Variante als Eval und Produktion)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Abhaengigkeiten
        run: pip install -e ".[dev,examples,trace]"
      - name: Ruff
        run: ruff check . ../scripts ../eval
      - name: Tests (mit den 20 langsamsten)
        run: python -m pytest -q --durations=20

  frontend:
    name: Frontend (lint, tsc, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Routentypen (LayoutProps, PageProps) erzeugen
        run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    name: E2E (Playwright, 390/768/1440, axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Maschinenansicht bei drei Breiten gegen gemockte API
        run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7

  migration:
    name: Migration von null (Alembic, pgvector)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: stromlauf
          POSTGRES_PASSWORD: stromlauf
          POSTGRES_DB: stromlauf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stromlauf -d stromlauf"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://stromlauf:stromlauf@localhost:5432/stromlauf
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Nur was die Migration braucht (keine Modelle, kein Docling)
        run: pip install "alembic>=1.13" "sqlalchemy>=2.0.36" "pgvector>=0.3.6" "psycopg[binary]>=3.2" "pydantic-settings>=2.6"
      - name: Leere Datenbank -> upgrade head
        run: alembic upgrade head
      - name: Alle Modelltabellen vorhanden
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          from app.config import get_settings
          from app.db import Base
          from app import models  # noqa: F401
          existing = set(inspect(create_engine(get_settings().database_url)).get_table_names())
          missing = {t.name for t in Base.metadata.sorted_tables} - existing
          assert not missing, f"fehlende Tabellen: {sorted(missing)}"
          assert "alembic_version" in existing
          print("ok:", len(existing), "Tabellen")
          PY
      - name: downgrade base raeumt auf
        run: |
          alembic downgrade base
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          from app.config import get_settings
          left = set(inspect(create_engine(get_settings().database_url)).get_table_names()) - {"alembic_version"}
          assert not left, f"uebrig: {sorted(left)}"
          print("ok: leer")
          PY
      - name: Datenbank aus der create_all-Zeit -> upgrade head (additiver Pfad)
        # Das alte Schema ist genau das der Baseline (test_alembic_baseline haelt beide deckungsgleich);
        # ohne alembic_version-Tabelle nimmt 0001 den additiven Pfad, danach laufen die neueren Revisionen.
        run: |
          alembic upgrade 0001_stromlauf_baseline
          python - <<'PY'
          from app.db import engine
          from sqlalchemy import text
          with engine.begin() as conn:
              conn.execute(text("DROP TABLE alembic_version"))
          print("create_all-Schema ohne Versionstabelle angelegt")
          PY
          alembic upgrade head
          alembic current | grep -q "(head)"

  docker:
    name: Backend-Image bauen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (ohne Push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: stromlauf-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image-Groesse und Import-Smoke
        run: |
          docker image ls stromlauf-backend:ci --format "{{.Repository}}:{{.Tag}} {{.Size}}"
          docker run --rm -e DATABASE_URL=postgresql+psycopg://x:y@localhost:5432/z stromlauf-backend:ci \
            python -c "import app.main, app.checkpointer, app.embeddings; print('imports ok')"
