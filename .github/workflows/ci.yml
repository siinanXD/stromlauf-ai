name: CI

# Laeuft bei jedem Push auf master und jedem Pull Request (Repo ist oeffentlich, Actions kostenlos).
# Lokal laufen dieselben Pruefungen mit `python scripts/check.py` (Hook: `python scripts/check.py --install-hook`).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Torch (CPU) vor Docling, sonst zieht pip die CUDA-Variante
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Abhaengigkeiten
        run: pip install -e ".[dev,examples]"
      - name: Ruff
        run: ruff check . ../scripts ../eval
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (lint, tsc, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Routentypen (LayoutProps, PageProps) erzeugen
        run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
