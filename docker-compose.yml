services:
  db:
    image: pgvector/pgvector:pg17
    container_name: stromlauf-db
    environment:
      POSTGRES_USER: stromlauf
      POSTGRES_PASSWORD: stromlauf
      POSTGRES_DB: stromlauf
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stromlauf -d stromlauf"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Ganze Demo mit einem Befehl: docker compose --profile demo up --build   (README "Demo in einem Befehl")
  backend:
    build: ./backend
    container_name: stromlauf-backend
    profiles: ["demo"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://stromlauf:stromlauf@db:5432/stromlauf
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEMO_MODE: "true"
      DEMO_EXAMPLE_DIR: /examples/foerderband
      # E2E-Lauf (ci.yml, compose-demo) hebt das Gesamtlimit an: 30 Seitenaufrufe je Minute reissen die 120 sonst
      DEMO_RATE_LIMIT: ${DEMO_RATE_LIMIT:-120}
      CORS_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
    ports:
      - "8010:8010"
    volumes:
      - ./examples/foerderband:/examples/foerderband:ro
      - appdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8010/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8010
    container_name: stromlauf-frontend
    profiles: ["demo"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Optional: visuelles Prototyping von Flows. Start: docker compose --profile langflow up -d
  langflow:
    image: langflowai/langflow:latest
    container_name: stromlauf-langflow
    profiles: ["langflow"]
    ports:
      - "7860:7860"
    environment:
      LANGFLOW_DATABASE_URL: sqlite:////app/langflow/langflow.db
      LANGFLOW_CONFIG_DIR: /app/langflow
    volumes:
      - langflow:/app/langflow

volumes:
  pgdata:
  appdata:
  langflow:
