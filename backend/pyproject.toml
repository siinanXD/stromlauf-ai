[project]
name = "stromlauf-backend"
version = "0.1.0"
description = "Stromlauf AI - Chatbot fuer Stromlaufplaene, Stuecklisten, Klemmenplaene und Siemens AWL"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "docling>=2.15",
    "sentence-transformers>=3.3",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "mcp>=2.2,<3",  # MCP-Server (stromlauf_mcp), offizielles SDK, MIT
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]
examples = ["reportlab>=4.2", "openpyxl>=3.1"]  # scripts/example_docs/build.py

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "stromlauf_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends()/File()/Form() als Default ist FastAPI-Idiom
ignore = ["B008", "UP017", "E501"]
