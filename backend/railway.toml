# Railway-Service "backend": Root Directory des Services auf `backend` setzen, dann greift diese Datei.
# Volume auf /data mounten (Uploads, Bilder, Plan-Cache, HF-Modelle). Variablen: siehe README "Deployment".
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
